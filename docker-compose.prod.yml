# StockPilot — production stack for the Cyber_Folks VPS.
#
# Three containers:
#   db   PostgreSQL 16      — EOD bars, fundamentals, daily rating snapshots
#   api  FastAPI/Uvicorn    — the Python backend (port 5111, internal only)
#   web  Nginx + React app  — static site + /api reverse proxy (port 8080 on localhost)
# plus one that `up` never starts:
#   ml   AI research jobs   — run one at a time with bash deploy/ml-run.sh <job>,
#                             capped so they can never slow the site down
#
# Start / update:   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# Logs:             docker compose -f docker-compose.prod.yml logs -f api
# Stop:             docker compose -f docker-compose.prod.yml down
#
# Only `web` is published, and only to 127.0.0.1 — the host's Nginx terminates
# TLS and forwards to it. The database is never reachable from the internet.

name: stockpilot

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stockpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-stockpilot}
      TZ: Europe/Warsaw
    volumes:
      # Named volume: market history survives container rebuilds and `down`.
      # It is deleted only by `docker compose down -v` — don't run that.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stockpilot} -d ${POSTGRES_DB:-stockpilot}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # No `ports:` on purpose — reachable only from the other containers.
    # Admin access from the VPS shell:
    #   docker compose -f docker-compose.prod.yml exec db psql -U stockpilot stockpilot

  api:
    build:
      context: ./backend-python
      dockerfile: Dockerfile
    # Named so the `ml` service below can run jobs from this very image.
    image: stockpilot-api:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # asyncpg URL: "db" is this compose file's database service name.
      STOCKPILOT_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-stockpilot}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-stockpilot}
      # The browser calls the API same-origin through the web container, so CORS
      # is not exercised in normal use. Kept correct for direct API calls.
      STOCKPILOT_CORS_ALLOWED_ORIGINS: '["https://${DOMAIN:?set DOMAIN in .env.prod}","https://www.${DOMAIN}"]'
      # Nightly refresh (Europe/Warsaw). GPW closes ~17:05.
      STOCKPILOT_INGEST_HOUR: ${STOCKPILOT_INGEST_HOUR:-18}
      STOCKPILOT_INGEST_MINUTE: ${STOCKPILOT_INGEST_MINUTE:-0}
      # Stock markets served (gpw, us, de, fr, nl, uk or "all"); GPW always on.
      # Default "all" (since 2026-09-22); set STOCKPILOT_MARKETS=gpw in
      # .env.prod to serve the GPW alone.
      STOCKPILOT_MARKETS: ${STOCKPILOT_MARKETS:-all}
      # The US market's nightly run (America/New_York time).
      STOCKPILOT_US_INGEST_HOUR: ${STOCKPILOT_US_INGEST_HOUR:-17}
      STOCKPILOT_US_INGEST_MINUTE: ${STOCKPILOT_US_INGEST_MINUTE:-15}
      # Live prices while an exchange is open: today's prices downloaded on
      # this cadence (60 = at every full hour), shown beside the ratings and
      # never fed into them. Must divide an hour.
      STOCKPILOT_LIVE_PRICES_ENABLED: ${STOCKPILOT_LIVE_PRICES_ENABLED:-true}
      STOCKPILOT_LIVE_PRICES_INTERVAL_MINUTES: ${STOCKPILOT_LIVE_PRICES_INTERVAL_MINUTES:-60}
      TZ: Europe/Warsaw
      # Action log (audit trail). Rows also go to the action_logs table; this
      # is the file half.
      STOCKPILOT_ACTION_LOG_RETENTION_DAYS: ${STOCKPILOT_ACTION_LOG_RETENTION_DAYS:-30}
      # Shared secret for /api/admin/* (the System page: health, errors, logs).
      # Set this in .env.prod: these endpoints expose tracebacks and visitor IPs.
      STOCKPILOT_ADMIN_TOKEN: ${STOCKPILOT_ADMIN_TOKEN:?STOCKPILOT_ADMIN_TOKEN must be set in .env.prod}
      # Sign-in (optional visitor accounts). JWT_SECRET is the key every
      # login token is signed with; left empty (the owner's choice) the app
      # invents one per start, so a restart signs everyone out — fine here,
      # but it would have to be set if this API ever ran more than one worker.
      # Registration is open by default.
      STOCKPILOT_JWT_SECRET: ${STOCKPILOT_JWT_SECRET:-}
      STOCKPILOT_JWT_ACCESS_MINUTES: ${STOCKPILOT_JWT_ACCESS_MINUTES:-30}
      STOCKPILOT_JWT_REFRESH_DAYS: ${STOCKPILOT_JWT_REFRESH_DAYS:-30}
      STOCKPILOT_REGISTRATION_OPEN: ${STOCKPILOT_REGISTRATION_OPEN:-true}
      STOCKPILOT_ADMIN_EMAILS: ${STOCKPILOT_ADMIN_EMAILS:-}
    volumes:
      # The rotating JSON-lines action log, bind-mounted to a REAL FOLDER ON
      # THE SERVER (./logs next to this file, i.e. ~/stockpilot/logs). A named
      # volume would hide it inside /var/lib/docker and force `docker compose
      # exec` to read it; this way `tail -f ~/stockpilot/logs/actions.jsonl`
      # just works, and the file survives `down`, rebuilds and `docker prune`.
      # The folder must be writable by the container's user (uid 10001) —
      # deploy/deploy.sh prepares it. Size is capped by the app itself
      # (10 MB x 6 files), so it cannot fill the disk.
      - ./logs:/app/logs
    # No `ports:` — only the web container talks to it, over the compose network.
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # The AI layer's research jobs (roadmap #31, agent/AI-ALGORITHMS-PLAN.md).
  # NEVER started by `up` — the "ml" profile keeps it out. One job at a time is
  # started by  bash deploy/ml-run.sh <job>  (agent/DEPLOYMENT.md §10) and the
  # container is removed when the job ends. It is the API's own image, run as a
  # separate container with a memory and CPU cap: a heavy job can slow itself
  # down, or be stopped by the cap, but never takes memory or CPU from the site.
  ml:
    image: stockpilot-api:local
    # Built by the `api` service above; never looked for on Docker Hub.
    pull_policy: never
    profiles: ["ml"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      STOCKPILOT_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-stockpilot}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-stockpilot}
      # Datasets, reports and the trial register all go to this folder, which
      # is ./ml next to this file on the server (see volumes).
      STOCKPILOT_ML_DIR: /app/ml
      # A job is not the API: it writes no action-log file of its own.
      STOCKPILOT_ACTION_LOG_TO_FILE: "false"
      TZ: Europe/Warsaw
    volumes:
      # ~/stockpilot/ml on the server — survives rebuilds, deploys and `down`.
      # deploy/deploy.sh makes it writable by the container's user (uid 10001).
      - ./ml:/app/ml
    # The cap. Memory equals memory+swap, so the job cannot spill into swap and
    # slow the whole server down: over the limit, only the job is stopped.
    mem_limit: ${STOCKPILOT_ML_MEMORY:-1g}
    memswap_limit: ${STOCKPILOT_ML_MEMORY:-1g}
    cpus: ${STOCKPILOT_ML_CPUS:-1}
    # A tiny init process starts the job, so `ml-run.sh stop` reaches it at
    # once — as the container's first process Python would ignore the request
    # until Docker force-killed it ten seconds later.
    init: true
    restart: "no"
    command: ["python", "-m", "scripts.ml_build_dataset", "--help"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      # 127.0.0.1 prefix = not exposed to the internet. The host Nginx (which
      # holds the Let's Encrypt certificate) proxies https://DOMAIN here.
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  pgdata:
