# StockPilot — host Nginx site (runs on the VPS itself, not in a container).
#
# INSTALL:
#   1. Replace every  stockpilot.pl  below with your real domain.
#   2. sudo cp deploy/nginx/stockpilot.conf /etc/nginx/sites-available/stockpilot
#   3. sudo ln -s /etc/nginx/sites-available/stockpilot /etc/nginx/sites-enabled/
#   4. sudo rm -f /etc/nginx/sites-enabled/default
#   5. sudo nginx -t && sudo systemctl reload nginx
#   6. sudo certbot --nginx -d stockpilot.pl -d www.stockpilot.pl
#
# Step 6 rewrites this file in place: Certbot adds the `listen 443 ssl` block,
# the certificate paths, and an automatic http → https redirect. Renewal is
# handled by the certbot systemd timer — nothing to do twice a year.
#
# This file is the HTTP-only starting point Certbot expects. Leave it as plain
# port 80 until Certbot has run.

server {
    listen 80;
    listen [::]:80;
    server_name stockpilot.pl www.stockpilot.pl;

    server_tokens off;

    # Certbot writes its ownership challenge here.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # OPTIONAL HARDENING — the manual "Refresh data" button is an unauthenticated
    # POST, so on a public site anyone could trigger a full Yahoo re-ingest.
    # Uncomment this block and put YOUR home IP in the `allow` line to keep the
    # button working for you and reject it for everyone else. (The nightly 18:00
    # job inside the container is unaffected — it never goes through Nginx.)
    #
    # location = /api/stocks/refresh {
    #     limit_except GET {
    #         allow 203.0.113.7;   # ← your IP; find it at https://ifconfig.me
    #         deny all;
    #     }
    #     proxy_pass http://127.0.0.1:8080;
    #     proxy_set_header Host              $host;
    #     proxy_set_header X-Real-IP         $remote_addr;
    #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_read_timeout 180s;
    # }

    location / {
        # Forwards to the `web` container published on 127.0.0.1:8080
        # (WEB_PORT in .env.prod).
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Matches the container's API timeouts — a cold ranking computation over
        # ~400 tickers can take minutes on the first request after a restart.
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
    }

    # After Certbot has run you can uncomment this to force HTTPS-only browsers.
    # Do it only once https:// is confirmed working — HSTS is hard to undo.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
