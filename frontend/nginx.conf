# Nginx config INSIDE the web container.
#
# Two jobs:
#   1. Serve the built React app (SPA: every unknown path returns index.html so
#      /charts/KGH, /filters, /heatmap … work on a hard refresh).
#   2. Reverse-proxy /api/* to the API container, so the browser only ever talks
#      to one origin (no CORS, no backend hostname baked into the JS bundle).
#
# TLS is NOT handled here — the host's Nginx terminates HTTPS and forwards to
# this container on 127.0.0.1:8080 (see deploy/nginx/stockpilot.conf).

# ── Rate limiting (abuse protection) ──────────────────────────────────────────
# These sit at the top of the file on purpose: the container includes this file
# from nginx's `http` context, where `limit_req_zone` belongs.
#
# The key is $http_x_real_ip, NOT $http_x_forwarded_for. The edge (host) Nginx
# sets `proxy_set_header X-Real-IP $remote_addr`, which OVERWRITES anything the
# client sends, so this is the genuine client IP and cannot be spoofed. We must
# not key on X-Forwarded-For: the API runs with --forwarded-allow-ips "*" and
# would trust a forged value. In the deployed setup the edge Nginx always sets
# X-Real-IP; nginx simply does not count requests whose key is empty.
#
# Zone names are prefixed so they can never clash with another site's zones.
#   stockpilot_api      generous — a normal stock page fires ~7 requests at once
#                       (covered by the burst); only a sustained flood trips it.
#   stockpilot_refresh  strict — the manual "Refresh data" button is a heavy,
#                       unauthenticated operation. The nightly refresh runs
#                       in-process (APScheduler) and never passes through Nginx,
#                       so it is completely unaffected by this.
limit_req_zone $http_x_real_ip zone=stockpilot_api:10m rate=20r/s;
limit_req_zone $http_x_real_ip zone=stockpilot_refresh:10m rate=6r/m;
# Reply to throttled requests with 429 Too Many Requests (nginx defaults to 503).
limit_req_status 429;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nothing here accepts uploads; cap request bodies to blunt junk traffic.
    client_max_body_size 1m;

    # Don't advertise the exact Nginx version.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Baseline security headers (the host Nginx adds HSTS once TLS is on).
    #
    # Nginx trap: `add_header` in a nested block REPLACES every add_header
    # inherited from the parent. So any location below that sets its own header
    # has to repeat these three, otherwise those responses ship without them.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Defence-in-depth: even if some escaping gap ever slipped user/Yahoo text
    # into the page, script-src 'self' stops an injected inline <script> from
    # running and connect-src 'self' stops exfiltration to another origin.
    # 'unsafe-inline' is allowed for STYLES only (React renders its style={{…}}
    # props to real inline style="" attributes) — never for scripts.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; form-action 'self'" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;

    # Container-level liveness probe (used by the Dockerfile HEALTHCHECK).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ── Heavy /refresh trigger (strict throttle) ──────────────────────────────
    # Exact (=) match, so ONLY POST/GET /api/stocks/refresh uses the strict zone;
    # /api/stocks/refresh/status is a different URI and keeps the normal /api/
    # limit, so status polling during a refresh is never throttled. This block
    # repeats the proxy settings because an exact-match location does not inherit
    # the /api/ location's directives.
    location = /api/stocks/refresh {
        limit_req zone=stockpilot_refresh burst=3 nodelay;

        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 5s;
        set $api_refresh http://api:5111;
        proxy_pass $api_refresh;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
    }

    # ── API proxy ─────────────────────────────────────────────────────────────
    # "api" is the service name in docker-compose.prod.yml; Docker's internal
    # DNS (127.0.0.11) resolves it to the backend container.
    #
    # The address is put in a VARIABLE on purpose. With a literal hostname Nginx
    # resolves it once at startup and caches that IP forever — so a deploy that
    # rebuilds only the API (new container, new IP) would leave this container
    # serving 502s until it was restarted by hand. A variable forces a fresh
    # lookup, and `valid=10s` re-checks every 10 seconds.
    location /api/ {
        # Generous flood guard for the whole API surface. burst=40 nodelay lets
        # a page's normal burst of calls through instantly and only queues/rejects
        # a genuine flood. The heavy /refresh trigger gets its own stricter limit
        # in the exact-match location below.
        limit_req zone=stockpilot_api burst=40 nodelay;

        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 5s;
        set $api_backend http://api:5111;

        # No URI part after the variable ⇒ the original request URI
        # (/api/stocks/…) is forwarded unchanged, which is what FastAPI expects.
        proxy_pass $api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A cold ranking/heatmap request computes VSA over ~400 tickers, which
        # can take well over a minute on the first hit after a restart.
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;

        # Note: the ranking endpoint's X-Total-Count header (and the CORS
        # Access-Control-Expose-Headers that goes with it) passes through
        # untouched — Nginx only strips a fixed set of hop-by-hop headers.
    }

    # Backend health probe, reachable from the host for monitoring.
    location = /health {
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 5s;
        set $api_health http://api:5111;

        proxy_pass $api_health/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── Static assets ─────────────────────────────────────────────────────────
    # Vite fingerprints filenames (app-a1b2c3d4.js), so these can be cached
    # forever — a new build produces new filenames.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # Repeated because add_header here overrides the server-level ones.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; form-action 'self'" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
    }

    # ── SPA fallback ──────────────────────────────────────────────────────────
    # index.html must never be cached, otherwise a browser keeps asking for the
    # previous deploy's asset filenames after an update and the page breaks.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        # Repeated because add_header here overrides the server-level ones.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; form-action 'self'" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
    }
}
