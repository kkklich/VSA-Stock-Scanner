<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Recognising stages and planning an exit</title><desc id="desc">A Stage 2 entry screen does not automatically provide a Stage 3 or Stage 4 exit. The illustration separates the entry context from later trade management.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="960" height="560" rx="18" fill="#0b1425" opacity="1"/><text x="48" y="55" font-size="29" fill="#e7edf7" text-anchor="start">Recognising stages and planning an exit</text><line x1="48" y1="107" x2="912" y2="107" stroke="#24364f" stroke-width="2" /><rect x="64" y="181" width="190" height="210" rx="14" fill="#111e33" opacity="1"/><circle cx="91" cy="211" r="15" fill="#38bdf8"/><text x="91" y="217" font-size="17" fill="#0b1425" text-anchor="middle">1</text><text x="84" y="257" font-size="22" fill="#e7edf7" text-anchor="start">Stage 1: base</text><text x="266" y="293" font-size="30" fill="#fbbf24" text-anchor="middle">›</text><rect x="278" y="181" width="190" height="210" rx="14" fill="#111e33" opacity="1"/><circle cx="305" cy="211" r="15" fill="#38bdf8"/><text x="305" y="217" font-size="17" fill="#0b1425" text-anchor="middle">2</text><text x="298" y="257" font-size="22" fill="#e7edf7" text-anchor="start">Stage 2:</text><text x="298" y="286" font-size="22" fill="#e7edf7" text-anchor="start">advance</text><text x="480" y="293" font-size="30" fill="#fbbf24" text-anchor="middle">›</text><rect x="492" y="181" width="190" height="210" rx="14" fill="#111e33" opacity="1"/><circle cx="519" cy="211" r="15" fill="#38bdf8"/><text x="519" y="217" font-size="17" fill="#0b1425" text-anchor="middle">3</text><text x="512" y="257" font-size="22" fill="#e7edf7" text-anchor="start">Stage 3:</text><text x="512" y="286" font-size="22" fill="#e7edf7" text-anchor="start">topping</text><text x="694" y="293" font-size="30" fill="#fbbf24" text-anchor="middle">›</text><rect x="706" y="181" width="190" height="210" rx="14" fill="#111e33" opacity="1"/><circle cx="733" cy="211" r="15" fill="#38bdf8"/><text x="733" y="217" font-size="17" fill="#0b1425" text-anchor="middle">4</text><text x="726" y="257" font-size="22" fill="#e7edf7" text-anchor="start">Stage 4:</text><text x="726" y="286" font-size="22" fill="#e7edf7" text-anchor="start">decline</text><text x="64" y="446" font-size="20" fill="#a6b8cf" text-anchor="start">The scanner describes an entry setup; plan exits separately</text><text x="48" y="542" font-size="13" fill="#a6b8cf" text-anchor="start">SCHEMATIC • NOT MARKET DATA</text><text x="912" y="542" font-size="13" fill="#a6b8cf" text-anchor="end">STOCKPILOT / EDUCATION</text></g></svg>
