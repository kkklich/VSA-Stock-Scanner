<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Drawdown from an equity peak</title><desc id="desc">Drawdown measures a decline from an earlier equity peak. In this model it is measured at candle closes, not at every intrabar price.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="960" height="560" rx="18" fill="#0b1425" opacity="1"/><text x="48" y="55" font-size="29" fill="#e7edf7" text-anchor="start">Drawdown from an equity peak</text><line x1="48" y1="107" x2="912" y2="107" stroke="#24364f" stroke-width="2" /><line x1="70" y1="170" x2="870" y2="170" stroke="#24364f" stroke-width="2" /><line x1="70" y1="232" x2="870" y2="232" stroke="#24364f" stroke-width="2" /><line x1="70" y1="295" x2="870" y2="295" stroke="#24364f" stroke-width="2" /><line x1="70" y1="357" x2="870" y2="357" stroke="#24364f" stroke-width="2" /><line x1="70" y1="420" x2="870" y2="420" stroke="#24364f" stroke-width="2" /><line x1="70" y1="170" x2="870" y2="170" stroke="#a6b8cf" stroke-width="2" stroke-dasharray="6 6"/><text x="870" y="161" font-size="19" fill="#a6b8cf" text-anchor="end">Previous peak</text><polyline points="80,397.27272727272725 190,306.3636363636364 300,170 410,260.9090909090909 520,374.54545454545456 630,420 740,329.0909090909091 850,215.45454545454544" fill="none" stroke="#34d399" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="80" cy="397.27272727272725" r="5" fill="#34d399"/><circle cx="190" cy="306.3636363636364" r="5" fill="#34d399"/><circle cx="300" cy="170" r="5" fill="#34d399"/><circle cx="410" cy="260.9090909090909" r="5" fill="#34d399"/><circle cx="520" cy="374.54545454545456" r="5" fill="#34d399"/><circle cx="630" cy="420" r="5" fill="#34d399"/><circle cx="740" cy="329.0909090909091" r="5" fill="#34d399"/><circle cx="850" cy="215.45454545454544" r="5" fill="#34d399"/><rect x="70" y="477" width="18" height="5" rx="0" 