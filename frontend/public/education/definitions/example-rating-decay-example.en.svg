<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">One signal fades toward neutral</title><desc id="desc">With no new signals, an initial bullish weight of 1 becomes 0.5 after 30 days and 0.25 after 60. The corresponding rounded ratings are 73, 62 and 56.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="960" height="560" rx="18" fill="#0b1425" opacity="1"/><text x="48" y="55" font-size="29" fill="#e7edf7" text-anchor="start">One signal fades toward neutral</text><line x1="48" y1="107" x2="912" y2="107" stroke="#24364f" stroke-width="2" /><line x1="70" y1="170" x2="870" y2="170" stroke="#24364f" stroke-width="2" /><line x1="70" y1="232" x2="870" y2="232" stroke="#24364f" stroke-width="2" /><line x1="70" y1="295" x2="870" y2="295" stroke="#24364f" stroke-width="2" /><line x1="70" y1="357" x2="870" y2="357" stroke="#24364f" stroke-width="2" /><line x1="70" y1="420" x2="870" y2="420" stroke="#24364f" stroke-width="2" /><line x1="70" y1="420" x2="870" y2="420" stroke="#a6b8cf" stroke-width="2" stroke-dasharray="6 6"/><text x="870" y="411" font-size="19" fill="#a6b8cf" text-anchor="end">Neutral = 50</text><polyline points="80,228.33333333333331 465,320 850,370" fill="none" stroke="#34d399" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="80" cy="228.33333333333331" r="5" fill="#34d399"/><circle cx="465" cy="320" r="5" fill="#34d399"/><circle cx="850" cy="370" r="5" fill="#34d399"/><rect x="70" y="477" width="18" height="5" rx="0" fill="#34d399" opacity="1"/><text x="98" y="486" font-size="18" fill="#34d399" text-anchor="start">Rating</text><text x="80" y="451" font-size="20" fill="#a6b8cf" text-anchor="start">Day 0</text><text x="850" y="451" font-size="20" fill="#a6b8cf" text-anchor="end">Day 60</text><text x="70" y="132" font-size="22" fill="#a6b8cf" text-anchor="start">Day 0 → 30 → 60; no new signals</text><text x="48" y="542" font-size="13" fill="#a6b8cf" text-anchor="start">SCHEMATIC • NOT MARKET DATA</text><text x="912" y="542" font-size="13" fill="#a6b8cf" text-anchor="end">STOCKPILOT / EDUCATION</text></g></svg>
