<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">The below-MA-200 score cap</title><desc id="desc">Below the 200-session average, the score is capped at 50. A high-volume up day alone does not establish a healthy trend.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="960" height="560" rx="18" fill="#0b1425" opacity="1"/><text x="48" y="55" font-size="29" fill="#e7edf7" text-anchor="start">The below-MA-200 score cap</text><line x1="48" y1="107" x2="912" y2="107" stroke="#24364f" stroke-width="2" /><line x1="70" y1="170" x2="870" y2="170" stroke="#24364f" stroke-width="2" /><line x1="70" y1="232" x2="870" y2="232" stroke="#24364f" stroke-width="2" /><line x1="70" y1="295" x2="870" y2="295" stroke="#24364f" stroke-width="2" /><line x1="70" y1="357" x2="870" y2="357" stroke="#24364f" stroke-width="2" /><line x1="70" y1="420" x2="870" y2="420" stroke="#24364f" stroke-width="2" /><polyline points="80,378.3333333333333 234,399.1666666666667 388,420 542,357.5 696,378.3333333333333 850,315.8333333333333" fill="none" stroke="#34d399" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><rect x="70" y="477" width="18" height="5" rx="0" fill="#34d399" opacity="1"/><text x="98" y="486" font-size="18" fill="#34d399" text-anchor="start">Price</text><polyline points="80,170 234,190.83333333333334 388,211.66666666666666 542,232.5 696,253.33333333333334 850,274.16666666666663" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><rect x="285" y="477" width="18" height="5" rx="0" fill="#38bdf8" opacity="1"/><text x="313" y="486" font-size="18" fill="#38bdf8" text-anchor="start">MA 200</text><text x="70" y="132" font-size="22" fill="#a6b8cf" text-anchor="start">Below MA 200 → score ≤ 50</text><text x="48" y="542" font-size="13" fill="#a6b8cf" text-anchor="start">SCHEMATIC • NOT MARKET DATA</text><text x="912" y="542" font-size="13" fill="#a6b8cf" text-anchor="end">STOCKPILOT / EDUCATION</text></g></svg>
