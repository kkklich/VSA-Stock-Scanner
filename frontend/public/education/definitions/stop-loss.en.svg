<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Stop loss and invalidation</title><desc id="desc">A planned stop lies beyond the level that invalidates the scenario. A gap can produce a worse execution price.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="960" height="560" rx="18" fill="#0b1425" opacity="1"/><text x="48" y="55" font-size="29" fill="#e7edf7" text-anchor="start">Stop loss and invalidation</text><line x1="48" y1="107" x2="912" y2="107" stroke="#24364f" stroke-width="2" /><line x1="610" y1="160" x2="610" y2="420" stroke="#a6b8cf" stroke-width="2" /><line x1="545" y1="290" x2="670" y2="290" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 6"/><text x="690" y="297" font-size="21" fill="#38bdf8" text-anchor="start">Entry = 100</text><line x1="545" y1="355" x2="670" y2="355" stroke="#fb7185" stroke-width="2" stroke-dasharray="6 6"/><text x="690" y="362" font-size="21" fill="#fb7185" text-anchor="start">SL = 95</text><line x1="545" y1="394" x2="670" y2="394" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 6"/><text x="690" y="401" font-size="21" fill="#fbbf24" text-anchor="start">Gap fill = 92</text><circle cx="610" cy="290" r="9" fill="#fbbf24"/><text x="65" y="220" font-size="28" fill="#e7edf7" text-anchor="start">Planned distance = 5; gap</text><text x="65" y="255" font-size="28" fill="#e7edf7" text-anchor="start">loss can exceed 5</text><text x="48" y="542" font-size="13" fill="#a6b8cf" text-anchor="start">SCHEMATIC • NOT MARKET DATA</text><text x="912" y="542" font-size="13" fill="#a6b8cf" text-anchor="end">STOCKPILOT / EDUCATION</text></g></svg>
