<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Weinstein 5 — The advance is only beginning</title><desc id="desc">the 30-week average has risen no more than 10% over those 10 weeks</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="960" height="560" rx="18" fill="#0b1425" opacity="1"/><text x="48" y="55" font-size="29" fill="#e7edf7" text-anchor="start">Weinstein 5 — The advance is only beginning</text><line x1="48" y1="107" x2="912" y2="107" stroke="#24364f" stroke-width="2" /><line x1="610" y1="160" x2="610" y2="420" stroke="#a6b8cf" stroke-width="2" /><rect x="560" y="246.66666666666669" width="100" height="173.33333333333331" rx="8" fill="#34d399" opacity="0.15"/><line x1="545" y1="420" x2="670" y2="420" stroke="#a6b8cf" stroke-width="2" stroke-dasharray="6 6"/><text x="690" y="427" font-size="21" fill="#a6b8cf" text-anchor="start">10 weeks ago: 100</text><line x1="545" y1="246.66666666666669" x2="670" y2="246.66666666666669" stroke="#34d399" stroke-width="2" stroke-dasharray="6 6"/><text x="690" y="253.66666666666669" font-size="21" fill="#34d399" text-anchor="start">Maximum: 110</text><line x1="545" y1="333.33333333333337" x2="670" y2="333.33333333333337" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 6"/><text x="690" y="340.33333333333337" font-size="21" fill="#fbbf24" text-anchor="start">Today: 105</text><circle cx="610" cy="333.33333333333337" r="9" fill="#fbbf24"/><text x="65" y="220" font-size="28" fill="#e7edf7" text-anchor="start">0% ≤ MA change ≤ 10%</text><text x="48" y="542" font-size="13" fill="#a6b8cf" text-anchor="start">SCHEMATIC • NOT MARKET DATA</text><text x="912" y="542" font-size="13" fill="#a6b8cf" text-anchor="end">STOCKPILOT / EDUCATION</text></g></svg>
