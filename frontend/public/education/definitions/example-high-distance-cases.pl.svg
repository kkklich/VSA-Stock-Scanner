<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Odległość od maksimum 200</title><desc id="desc">Zamknięcie 160 leży 20% poniżej 200 i spełnia tę jedną regułę. Zamknięcie 140 leży 30% poniżej i jej nie spełnia. Granicą jest 150.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="960" height="560" rx="18" fill="#0b1425" opacity="1"/><text x="48" y="55" font-size="29" fill="#e7edf7" text-anchor="start">Odległość od maksimum 200</text><line x1="48" y1="107" x2="912" y2="107" stroke="#24364f" stroke-width="2" /><line x1="65" y1="420" x2="880" y2="420" stroke="#24364f" stroke-width="2" /><text x="65" y="137" font-size="18" fill="#a6b8cf" text-anchor="start">CENA ZAMKNIĘCIA</text><rect x="95" y="219.18032786885246" width="96" height="200.81967213114754" rx="4" fill="#34d399" opacity="1"/><text x="143" y="206.18032786885246" font-size="22" fill="#34d399" text-anchor="middle">160</text><text x="143" y="454" font-size="18" fill="#a6b8cf" text-anchor="middle">Spełnia: −20%</text><rect x="470" y="244.28278688524588" width="96" height="175.71721311475412" rx="4" fill="#fb7185" opacity="1"/><text x="518" y="231.28278688524588" font-size="22" fill="#fb7185" text-anchor="middle">140</text><text x="518" y="454" font-size="18" fill="#a6b8cf" text-anchor="middle">Nie spełnia:</text><text x="518" y="479" font-size="18" fill="#a6b8cf" text-anchor="middle">−30%</text><line x1="64" y1="231.73155737704917" x2="880" y2="231.73155737704917" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="7 7"/><text x="880" y="219.73155737704917" font-size="19" fill="#c4b5fd" text-anchor="end">Minimalne zamknięcie = 150</text><text x="48" y="542" font-size="13" fill="#a6b8cf" text-anchor="start">SCHEMAT • NIE DANE RYNKOWE</text><text x="912" y="542" font-size="13" fill="#a6b8cf" text-anchor="end">STOCKPILOT / EDUCATION</text></g></svg>
