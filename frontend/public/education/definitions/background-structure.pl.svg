="388" cy="232.5" r="5" fill="#fb7185"/><circle cx="542" cy="370" r="5" fill="#fb7185"/><circle cx="696" cy="307.5" r="5" fill="#fb7185"/><circle cx="850" cy="420" r="5" fill="#fb7185"/><rect x="285" y="477" width="18" height="5" rx="0" fill="#fb7185" opacity="1"/><text x="313" y="486" font-size="18" fill="#fb7185" text-anchor="start">Niższe szczyty /</text><text x="313" y="511" font-size="18" fill="#fb7185" text-anchor="start">dołki</text><text x="70" y="132" font-size="22" fill="#a6b8cf" text-anchor="start">Odczytaj strukturę przed lokalnym sygnałem</text><text x="48" y="542" font-size="13" fill="#a6b8cf" text-anchor="start">SCHEMAT • NIE DANE RYNKOWE</text><text x="912" y="542" font-size="13" fill="#a6b8cf" text-anchor="end">STOCKPILOT / EDUCATION</text></g></svg>
