<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">ABC correction</title><desc id="desc">A, B and C label successive corrective legs. The course does not provide one universal automatic swing-detection rule.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="960" height="560" rx="18" fill="#0b1425" opacity="1"/><text x="48" y="55" font-size="29" fill="#e7edf7" text-anchor="start">ABC correction</text><line x1="48" y1="107" x2="912" y2="107" stroke="#24364f" stroke-width="2" /><line x1="70" y1="170" x2="870" y2="170" stroke="#24364f" stroke-width="2" /><line x1="70" y1="232" x2="870" y2="232" stroke="#24364f" stroke-width="2" /><line x1="70" y1="295" x2="870" y2="295" stroke="#24364f" stroke-width="2" /><line x1="70" y1="357" x2="870" y2="357" stroke="#24364f" stroke-width="2" /><line x1="70" y1="420" x2="870" y2="420" stroke="#24364f" stroke-width="2" /><polyline points="80,420 165.55555555555554,336.6666666666667 251.11111111111111,381.1111111111111 336.6666666666667,270 422.22222222222223,308.8888888888889 507.77777777777777,170 593.3333333333334,264.44444444444446 678.8888888888889,214.44444444444446 764.4444444444445,292.22222222222223 850,253.33333333333334" fill="none" stroke="#34d399" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="80" cy="420" r="5" fill="#34d399"/><circle cx="165.55555555555554" cy="336.6666666666667" r="5" fill="#34d399"/><circle cx="251.11111111111111" cy="381.1111111111111" r="5" fill="#34d399"/><circle cx="336.6666666666667" cy="270" r="5" fill="#34d399"/><circle cx="422.22222222222223" cy="308.8888888888889" r="5" fill="#34d399"/><circle cx="507.77777777777777" cy="170" r="5" fill="#34d399"/><circle cx="593.3333333333334" cy="264.44444444444446" r="5" fill="#34d399"/><circle cx="678.8888888888889" cy="214.44444444444446" r="5" fill="#34d399"/><circle cx="764.4444444444445" cy="292.22222222222223" r="5" fill="#34d399"/><circle cx="850" cy="253.33333333333334" r="5" fill="#34d399"/><rect x="70" y="477" width="18" height="5" rx="0" fill="#34d399" opacity="1"/><text x="98" y="486" font-size="18" fill="#34d399" text-anchor="start">Price: impulse</text><text x="98" y="511" font-size="18" fill="#34d399" text-anchor="start">then ABC</text><text x="70" y="132" font-size="22" fill="#a6b8cf" text-anchor="start">From the peak: A down → B up → C down</text><text x="48" y="542" font-size="13" fill="#a6b8cf" text-anchor="start">SCHEMATIC • NOT MARKET DATA</text><text x="912" y="542" font-size="13" fill="#a6b8cf" text-anchor="end">STOCKPILOT / EDUCATION</text></g></svg>
