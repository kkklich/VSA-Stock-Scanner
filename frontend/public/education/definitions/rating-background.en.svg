<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Rising, neutral or falling background</title><desc id="desc">The previous close is compared with the prior 30-session average. The neutral band lies between −3% and +3%.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="960" height="560" rx="18" fill="#0b1425" opacity="1"/><text x="48" y="55" font-size="29" fill="#e7edf7" text-anchor="start">Rising, neutral or falling background</text><line x1="48" y1="107" x2="912" y2="107" stroke="#24364f" stroke-width="2" /><line x1="610" y1="160" x2="610" y2="420" stroke="#a6b8cf" stroke-width="2" /><rect x="560" y="251" width="100" height="78" rx="8" fill="#34d399" opacity="0.15"/><line x1="545" y1="329" x2="670" y2="329" stroke="#fb7185" stroke-width="2" stroke-dasharray="6 6"/><text x="690" y="336" font-size="21" fill="#fb7185" text-anchor="start">−3%: 97</text><line x1="545" y1="290" x2="670" y2="290" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 6"/><text x="690" y="297" font-size="21" fill="#38bdf8" text-anchor="start">MA 30 = 100</text><line x1="545" y1="251" x2="670" y2="251" stroke="#34d399" stroke-width="2" stroke-dasharray="6 6"/><text x="690" y="258" font-size="21" fill="#34d399" text-anchor="start">+3%: 103</text><line x1="545" y1="225" x2="670" y2="225" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 6"/><text x="690" y="232" font-size="21" fill="#fbbf24" text-anchor="start">C(t−1) = 105</text><circle cx="610" cy="225" r="9" fill="#fbbf24"/><text x="65" y="220" font-size="28" fill="#e7edf7" text-anchor="start">Compare with earlier data</text><text x="48" y="542" font-size="13" fill="#a6b8cf" text-anchor="start">SCHEMATIC • NOT MARKET DATA</text><text x="912" y="542" font-size="13" fill="#a6b8cf" text-anchor="end">STOCKPILOT / EDUCATION</text></g></svg>
