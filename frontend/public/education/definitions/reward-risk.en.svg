<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">R and reward-to-risk</title><desc id="desc">With entry 100, stop 95 and target 115, the initial risk is 5 and the planned reward is 15, or 3R. The ratio does not establish a profitable strategy.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="960" height="560" rx="18" fill="#0b1425" opacity="1"/><text x="48" y="55" font-size="29" fill="#e7edf7" text-anchor="start">R and reward-to-risk</text><line x1="48" y1="107" x2="912" y2="107" stroke="#24364f" stroke-width="2" /><line x1="610" y1="160" x2="610" y2="420" stroke="#a6b8cf" stroke-width="2" /><line x1="545" y1="160" x2="670" y2="160" stroke="#34d399" stroke-width="2" stroke-dasharray="6 6"/><text x="690" y="167" font-size="21" fill="#34d399" text-anchor="start">Target: +3R</text><line x1="545" y1="355" x2="670" y2="355" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 6"/><text x="690" y="362" font-size="21" fill="#38bdf8" text-anchor="start">Entry: 0R</text><line x1="545" y1="420" x2="670" y2="420" stroke="#fb7185" stroke-width="2" stroke-dasharray="6 6"/><text x="690" y="427" font-size="21" fill="#fb7185" text-anchor="start">Stop: −1R</text><circle cx="610" cy="355" r="9" fill="#fbbf24"/><text x="65" y="220" font-size="28" fill="#e7edf7" text-anchor="start">R = 100 − 95 = 5</text><text x="65" y="357" font-size="21" fill="#a6b8cf" text-anchor="start">15 / 5 = 3 : 1</text><text x="48" y="542" font-size="13" fill="#a6b8cf" text-anchor="start">SCHEMATIC • NOT MARKET DATA</text><text x="912" y="542" font-size="13" fill="#a6b8cf" text-anchor="end">STOCKPILOT / EDUCATION</text></g></svg>
