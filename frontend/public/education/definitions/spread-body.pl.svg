<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Spread i korpus to różne wielkości</title><desc id="desc">Spread to H − L. Korpus jest odległością między O i C; knoty dopełniają cały zakres.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="960" height="560" rx="18" fill="#0b1425" opacity="1"/><text x="48" y="55" font-size="29" fill="#e7edf7" text-anchor="start">Spread i korpus to różne wielkości</text><line x1="48" y1="107" x2="912" y2="107" stroke="#24364f" stroke-width="2" /><line x1="240" y1="173" x2="240" y2="365" stroke="#34d399" stroke-width="2" /><rect x="202" y="221" width="76" height="72" rx="2" fill="#34d399" opacity="1"/><line x1="198" y1="293" x2="147" y2="293" stroke="#38bdf8" stroke-width="2" /><text x="135" y="300" font-size="22" fill="#38bdf8" text-anchor="end">O 102</text><line x1="282" y1="173" x2="333" y2="173" stroke="#a6b8cf" stroke-width="2" /><text x="345" y="180" font-size="22" fill="#a6b8cf" text-anchor="start">H 112</text><line x1="282" y1="365" x2="333" y2="365" stroke="#a6b8cf" stroke-width="2" /><text x="345" y="372" font-size="22" fill="#a6b8cf" text-anchor="start">L 96</text><line x1="282" y1="221" x2="333" y2="221" stroke="#fbbf24" stroke-width="2" /><text x="345" y="228" font-size="22" fill="#fbbf24" text-anchor="start">C 108</text><text x="240" y="466" font-size="20" fill="#a6b8cf" text-anchor="middle">Spread = 16; korpus = 6</text><line x1="680" y1="245" x2="680" y2="317" stroke="#34d399" stroke-width="2" /><rect x="642" y="269" width="76" height="24" rx="2" fill="#34d399" opacity="1"/><line x1="638" y1="293" x2="587" y2="293" stroke="#38bdf8" stroke-width="2" /><text x="575" y="300" font-size="22" fill="#38bdf8" text-anchor="end">O 102</text><line x1="722" y1="245" x2="773" y2="245" stroke="#a6b8cf" stroke-width="2" /><text x="785" y="252" font-size="22" fill="#a6b8cf" text-anchor="start">H 106</text><line x1="722" y1="317" x2="773" y2="317" stroke="#a6b8cf" stroke-width="2" /><text x="785" y="324" font-size="22" fill="#a6b8cf" text-anchor="start">L 100</text><line x1="722" y1="269" x2="773" y2="269" stroke="#fbbf24" stroke-width="2" /><text x="785" y="276" font-size="22" fill="#fbbf24" text-anchor="start">C 104</text><text x="680" y="466" font-size="20" fill="#a6b8cf" text-anchor="middle">Spread = 6; korpus = 2</text><text x="48" y="542" font-size="13" fill="#a6b8cf" text-anchor="start">SCHEMAT • NIE DANE RYNKOWE</text><text x="912" y="542" font-size="13" fill="#a6b8cf" text-anchor="end">STOCKPILOT / EDUCATION</text></g></svg>
