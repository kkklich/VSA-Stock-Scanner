<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Jedna niespełniona reguła zmienia wynik</title><desc id="desc">W widoku siedmiu reguł strukturalnych sześć daje około 86, a siedem 100. Ranking rynku dodaje siłę względną jako ósmą regułę.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="960" height="560" rx="18" fill="#0b1425" opacity="1"/><text x="48" y="55" font-size="29" fill="#e7edf7" text-anchor="start">Jedna niespełniona reguła zmienia wynik</text><line x1="48" y1="107" x2="912" y2="107" stroke="#24364f" stroke-width="2" /><line x1="65" y1="420" x2="880" y2="420" stroke="#24364f" stroke-width="2" /><text x="65" y="137" font-size="18" fill="#a6b8cf" text-anchor="start">WYNIK STRUKTURALNY</text><rect x="95" y="247.29508196721312" width="96" height="172.70491803278688" rx="4" fill="#38bdf8" opacity="1"/><text x="143" y="234.29508196721312" font-size="22" fill="#38bdf8" text-anchor="middle">86</text><text x="143" y="454" font-size="18" fill="#a6b8cf" text-anchor="middle">6 z 7</text><rect x="470" y="219.18032786885246" width="96" height="200.81967213114754" rx="4" fill="#34d399" opacity="1"/><text x="518" y="206.18032786885246" font-size="22" fill="#34d399" text-anchor="middle">100</text><text x="518" y="454" font-size="18" fill="#a6b8cf" text-anchor="middle">7 z 7</text><text x="64" y="506" font-size="20" fill="#a6b8cf" text-anchor="start">Wynik mierzy kompletność reguł</text><text x="48" y="542" font-size="13" fill="#a6b8cf" text-anchor="start">SCHEMAT • NIE DANE RYNKOWE</text><text x="912" y="542" font-size="13" fill="#a6b8cf" text-anchor="end">STOCKPILOT / EDUCATION</text></g></svg>
