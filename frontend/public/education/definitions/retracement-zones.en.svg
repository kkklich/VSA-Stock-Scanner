<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Retracement zones</title><desc id="desc">For the illustrated rise from 100 to 140, the 50% retracement is 120 and the 61.8% retracement is 115.28. A level alone is not a signal.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="960" height="560" rx="18" fill="#0b1425" opacity="1"/><text x="48" y="55" font-size="29" fill="#e7edf7" text-anchor="start">Retracement zones</text><line x1="48" y1="107" x2="912" y2="107" stroke="#24364f" stroke-width="2" /><line x1="610" y1="160" x2="610" y2="420" stroke="#a6b8cf" stroke-width="2" /><line x1="545" y1="160" x2="670" y2="160" stroke="#a6b8cf" stroke-width="2" stroke-dasharray="6 6"/><text x="690" y="167" font-size="21" fill="#a6b8cf" text-anchor="start">H = 140</text><line x1="545" y1="290" x2="670" y2="290" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 6"/><text x="690" y="297" font-size="21" fill="#38bdf8" text-anchor="start">50% → 120</text><line x1="545" y1="320.68" x2="670" y2="320.68" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="6 6"/><text x="690" y="327.68" font-size="21" fill="#c4b5fd" text-anchor="start">61.8% → 115.28</text><line x1="545" y1="420" x2="670" y2="420" stroke="#a6b8cf" stroke-width="2" stroke-dasharray="6 6"/><text x="690" y="427" font-size="21" fill="#a6b8cf" text-anchor="start">L = 100</text><circle cx="610" cy="290" r="9" fill="#fbbf24"/><text x="65" y="220" font-size="28" fill="#e7edf7" text-anchor="start">140 − (140 − 100) × ratio</text><text x="48" y="542" font-size="13" fill="#a6b8cf" text-anchor="start">SCHEMATIC • NOT MARKET DATA</text><text x="912" y="542" font-size="13" fill="#a6b8cf" text-anchor="end">STOCKPILOT / EDUCATION</text></g></svg>
