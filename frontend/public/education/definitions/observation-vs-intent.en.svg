<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Observation versus participant intent</title><desc id="desc">Heavy trading with little price progress is observable. The identity and intention of a specific buyer cannot be read from that bar alone.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="960" height="560" rx="18" fill="#0b1425" opacity="1"/><text x="48" y="55" font-size="29" fill="#e7edf7" text-anchor="start">Observation versus participant intent</text><line x1="48" y1="107" x2="912" y2="107" stroke="#24364f" stroke-width="2" /><rect x="64" y="181" width="261.3333333333333" height="210" rx="14" fill="#111e33" opacity="1"/><circle cx="91" cy="211" r="15" fill="#38bdf8"/><text x="91" y="217" font-size="17" fill="#0b1425" text-anchor="middle">1</text><text x="84" y="257" font-size="22" fill="#e7edf7" text-anchor="start">Observed: high volume</text><text x="337.3333333333333" y="293" font-size="30" fill="#fbbf24" text-anchor="middle">›</text><rect x="349.3333333333333" y="181" width="261.3333333333333" height="210" rx="14" fill="#111e33" opacity="1"/><circle cx="376.3333333333333" cy="211" r="15" fill="#38bdf8"/><text x="376.3333333333333" y="217" font-size="17" fill="#0b1425" text-anchor="middle">2</text><text x="369.3333333333333" y="257" font-size="22" fill="#e7edf7" text-anchor="start">Observed: small</text><text x="369.3333333333333" y="286" font-size="22" fill="#e7edf7" text-anchor="start">progress</text><text x="622.6666666666666" y="293" font-size="30" fill="#fbbf24" text-anchor="middle">›</text><rect x="634.6666666666666" y="181" width="261.3333333333333" height="210" rx="14" fill="#111e33" opacity="1"/><circle cx="661.6666666666666" cy="211" r="15" fill="#38bdf8"/><text x="661.6666666666666" y="217" font-size="17" fill="#0b1425" text-anchor="middle">3</text><text x="654.6666666666666" y="257" font-size="22" fill="#e7edf7" text-anchor="start">Hypothesis:</text><text x="654.6666666666666" y="286" font-size="22" fill="#e7edf7" text-anchor="start">absorption</text><text x="64" y="446" font-size="20" fill="#a6b8cf" text-anchor="start">A hypothesis about accumulation is not participant identification</text><text x="48" y="542" font-size="13" fill="#a6b8cf" text-anchor="start">SCHEMATIC • NOT MARKET DATA</text><text x="912" y="542" font-size="13" fill="#a6b8cf" text-anchor="end">STOCKPILOT / EDUCATION</text></g></svg>
