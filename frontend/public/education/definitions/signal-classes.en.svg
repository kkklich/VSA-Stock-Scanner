<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Strength and weakness: three classes</title><desc id="desc">The course groups signals by accumulation/distribution, gathering/flooding, and testing. Context can change the class of a particular pattern.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="960" height="560" rx="18" fill="#0b1425" opacity="1"/><text x="48" y="55" font-size="29" fill="#e7edf7" text-anchor="start">Strength and weakness: three classes</text><line x1="48" y1="107" x2="912" y2="107" stroke="#24364f" stroke-width="2" /><rect x="64" y="153" width="261.3333333333333" height="125" rx="14" fill="#111e33" opacity="1"/><circle cx="91" cy="183" r="15" fill="#38bdf8"/><text x="91" y="189" font-size="17" fill="#0b1425" text-anchor="middle">1</text><text x="84" y="229" font-size="22" fill="#e7edf7" text-anchor="start">Accumulation</text><text x="337.3333333333333" y="222.5" font-size="30" fill="#fbbf24" text-anchor="middle">›</text><rect x="349.3333333333333" y="153" width="261.3333333333333" height="125" rx="14" fill="#111e33" opacity="1"/><circle cx="376.3333333333333" cy="183" r="15" fill="#38bdf8"/><text x="376.3333333333333" y="189" font-size="17" fill="#0b1425" text-anchor="middle">2</text><text x="369.3333333333333" y="229" font-size="22" fill="#e7edf7" text-anchor="start">Gathering supply</text><text x="622.6666666666666" y="222.5" font-size="30" fill="#fbbf24" text-anchor="middle">›</text><rect x="634.6666666666666" y="153" width="261.3333333333333" height="125" rx="14" fill="#111e33" opacity="1"/><circle cx="661.6666666666666" cy="183" r="15" fill="#38bdf8"/><text x="661.6666666666666" y="189" font-size="17" fill="#0b1425" text-anchor="middle">3</text><text x="654.6666666666666" y="229" font-size="22" fill="#e7edf7" text-anchor="start">Testing supply</text><rect x="64" y="309" width="261.3333333333333" height="125" rx="14" fill="#111e33" opacity="1"/><circle cx="91" cy="339" r="15" fill="#38bdf8"/><text x="91" y="345" font-size="17" fill="#0b1425" text-anchor="middle">4</text><text x="84" y="385" font-size="22" fill="#e7edf7" text-anchor="start">Distribution</text><text x="337.3333333333333" y="378.5" font-size="30" fill="#fbbf24" text-anchor="middle">›</text><rect x="349.3333333333333" y="309" width="261.3333333333333" height="125" rx="14" fill="#111e33" opacity="1"/><circle cx="376.3333333333333" cy="339" r="15" fill="#38bdf8"/><text x="376.3333333333333" y="345" font-size="17" fill="#0b1425" text-anchor="middle">5</text><text x="369.3333333333333" y="385" font-size="22" fill="#e7edf7" text-anchor="start">Flooding demand</text><text x="622.6666666666666" y="378.5" font-size="30" fill="#fbbf24" text-anchor="middle">›</text><rect x="634.6666666666666" y="309" width="261.3333333333333" height="125" rx="14" fill="#111e33" opacity="1"/><circle cx="661.6666666666666" cy="339" r="15" fill="#38bdf8"/><text x="661.6666666666666" y="345" font-size="17" fill="#0b1425" text-anchor="middle">6</text><text x="654.6666666666666" y="385" font-size="22" fill="#e7edf7" text-anchor="start">Testing demand</text><text x="48" y="542" font-size="13" fill="#a6b8cf" text-anchor="start">SCHEMATIC • NOT MARKET DATA</text><text x="912" y="542" font-size="13" fill="#a6b8cf" text-anchor="end">STOCKPILOT / EDUCATION</text></g></svg>
