<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Wolumen a liczba otwartych kontraktów</title><desc id="desc">Kontrakty obrócone w okresie i kontrakty nadal otwarte to różne miary. Akcje, kontrakty i liczba ticków również mają różne jednostki.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="960" height="560" rx="18" fill="#0b1425" opacity="1"/><text x="48" y="55" font-size="29" fill="#e7edf7" text-anchor="start">Wolumen a liczba otwartych kontraktów</text><line x1="48" y1="107" x2="912" y2="107" stroke="#24364f" stroke-width="2" /><rect x="64" y="181" width="404" height="210" rx="14" fill="#111e33" opacity="1"/><circle cx="91" cy="211" r="15" fill="#38bdf8"/><text x="91" y="217" font-size="17" fill="#0b1425" text-anchor="middle">1</text><text x="84" y="257" font-size="22" fill="#e7edf7" text-anchor="start">Wolumen: obrót w okresie</text><text x="480" y="293" font-size="30" fill="#fbbf24" text-anchor="middle">›</text><rect x="492" y="181" width="404" height="210" rx="14" fill="#111e33" opacity="1"/><circle cx="519" cy="211" r="15" fill="#38bdf8"/><text x="519" y="217" font-size="17" fill="#0b1425" text-anchor="middle">2</text><text x="512" y="257" font-size="22" fill="#e7edf7" text-anchor="start">Open interest: nadal otwarte</text><text x="64" y="446" font-size="20" fill="#a6b8cf" text-anchor="start">Porównuj ten sam instrument, źródło i interwał</text><text x="48" y="542" font-size="13" fill="#a6b8cf" text-anchor="start">SCHEMAT • NIE DANE RYNKOWE</text><text x="912" y="542" font-size="13" fill="#a6b8cf" text-anchor="end">STOCKPILOT / EDUCATION</text></g></svg>
