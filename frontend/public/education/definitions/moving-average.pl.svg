<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Średnia krocząca (MA)</title><desc id="desc">Średnia krocząca uśrednia zamknięcia w swoim oknie. Ten przykład z czterech sesji daje 103; metoda używa 50, 150 i 200 sesji.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="960" height="560" rx="18" fill="#0b1425" opacity="1"/><text x="48" y="55" font-size="29" fill="#e7edf7" text-anchor="start">Średnia krocząca (MA)</text><line x1="48" y1="107" x2="912" y2="107" stroke="#24364f" stroke-width="2" /><line x1="70" y1="170" x2="870" y2="170" stroke="#24364f" stroke-width="2" /><line x1="70" y1="232" x2="870" y2="232" stroke="#24364f" stroke-width="2" /><line x1="70" y1="295" x2="870" y2="295" stroke="#24364f" stroke-width="2" /><line x1="70" y1="357" x2="870" y2="357" stroke="#24364f" stroke-width="2" /><line x1="70" y1="420" x2="870" y2="420" stroke="#24364f" stroke-width="2" /><line x1="70" y1="295" x2="870" y2="295" stroke="#a6b8cf" stroke-width="2" stroke-dasharray="6 6"/><text x="870" y="286" font-size="19" fill="#a6b8cf" text-anchor="end">MA = 103</text><polyline points="80,420 336.6666666666667,336.6666666666667 593.3333333333334,253.33333333333334 850,170" fill="none" stroke="#34d399" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="80" cy="420" r="5" fill="#34d399"/><circle cx="336.6666666666667" cy="336.6666666666667" r="5" fill="#34d399"/><circle cx="593.3333333333334" cy="253.33333333333334" r="5" fill="#34d399"/><circle cx="850" cy="170" r="5" fill="#34d399"/><rect x="70" y="477" width="18" height="5" rx="0" fill="#34d399" opacity="1"/><text x="98" y="486" font-size="18" fill="#34d399" text-anchor="start">Zamknięcia</text><text x="70" y="132" font-size="22" fill="#a6b8cf" text-anchor="start">(100 + 102 + 104 + 106) / 4 = 103</text><text x="48" y="542" font-size="13" fill="#a6b8cf" text-anchor="start">SCHEMAT • NIE DANE RYNKOWE</text><text x="912" y="542" font-size="13" fill="#a6b8cf" text-anchor="end">STOCKPILOT / EDUCATION</text></g></svg>
