<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Same starting average, different slopes</title><desc id="desc">The rising MA 200 passes the slope check; the falling example does not. Being above an average alone does not establish its slope.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="960" height="560" rx="18" fill="#0b1425" opacity="1"/><text x="48" y="55" font-size="29" fill="#e7edf7" text-anchor="start">Same starting average, different slopes</text><line x1="48" y1="107" x2="912" y2="107" stroke="#24364f" stroke-width="2" /><line x1="70" y1="170" x2="870" y2="170" stroke="#24364f" stroke-width="2" /><line x1="70" y1="232" x2="870" y2="232" stroke="#24364f" stroke-width="2" /><line x1="70" y1="295" x2="870" y2="295" stroke="#24364f" stroke-width="2" /><line x1="70" y1="357" x2="870" y2="357" stroke="#24364f" stroke-width="2" /><line x1="70" y1="420" x2="870" y2="420" stroke="#24364f" stroke-width="2" /><polyline points="80,295 272.5,263.75 465,232.5 657.5,201.25 850,170" fill="none" stroke="#34d399" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="80" cy="295" r="5" fill="#34d399"/><circle cx="272.5" cy="263.75" r="5" fill="#34d399"/><circle cx="465" cy="232.5" r="5" fill="#34d399"/><circle cx="657.5" cy="201.25" r="5" fill="#34d399"/><circle cx="850" cy="170" r="5" fill="#34d399"/><rect x="70" y="477" width="18" height="5" rx="0" fill="#34d399" opacity="1"/><text x="98" y="486" font-size="18" fill="#34d399" text-anchor="start">Rising MA 200</text><polyline points="80,295 272.5,326.25 465,357.5 657.5,388.75 850,420" fill="none" stroke="#fb7185" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="80" cy="295" r="5" fill="#fb7185"/><circle cx="272.5" cy="326.25" r="5" fill="#fb7185"/><circle cx="465" cy="357.5" r="5" fill="#fb7185"/><circle cx="657.5" cy="388.75" r="5" fill="#fb7185"/><circle cx="850" cy="420" r="5" fill="#fb7185"/><rect x="285" y="477" width="18" height="5" rx="0" fill="#fb7185" opacity="1"/><text x="313" y="486" font-size="18" fill="#fb7185" text-anchor="start">Falling MA 200</text><text x="80" y="451" font-size="20" fill="#a6b8cf" text-anchor="start">t − 20</text><text x="850" y="451" font-size="20" fill="#a6b8cf" text-anchor="end">t</text><text x="48" y="542" font-size="13" fill="#a6b8cf" text-anchor="start">SCHEMATIC • NOT MARKET DATA</text><text x="912" y="542" font-size="13" fill="#a6b8cf" text-anchor="end">STOCKPILOT / EDUCATION</text></g></svg>
