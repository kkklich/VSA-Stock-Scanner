<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Price reactions to new information</title><desc id="desc">The course distinguishes continuation, reversal, an initial contrary move and a delayed or unclear reaction. Good news does not guarantee a price rise.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="960" height="560" rx="18" fill="#0b1425" opacity="1"/><text x="48" y="55" font-size="29" fill="#e7edf7" text-anchor="start">Price reactions to new information</text><line x1="48" y1="107" x2="912" y2="107" stroke="#24364f" stroke-width="2" /><line x1="70" y1="170" x2="870" y2="170" stroke="#24364f" stroke-width="2" /><line x1="70" y1="232" x2="870" y2="232" stroke="#24364f" stroke-width="2" /><line x1="70" y1="295" x2="870" y2="295" stroke="#24364f" stroke-width="2" /><line x1="70" y1="357" x2="870" y2="357" stroke="#24364f" stroke-width="2" /><line x1="70" y1="420" x2="870" y2="420" stroke="#24364f" stroke-width="2" /><polyline points="80,348.57142857142856 234,348.57142857142856 388,348.57142857142856 542,289.04761904761904 696,229.52380952380955 850,170" fill="none" stroke="#34d399" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><rect x="70" y="477" width="18" height="5" rx="0" fill="#34d399" opacity="1"/><text x="98" y="486" font-size="18" fill="#34d399" text-anchor="start">Continuation</text><polyline points="80,348.57142857142856 234,348.57142857142856 388,348.57142857142856 542,229.52380952380955 696,312.8571428571429 850,384.2857142857143" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><rect x="285" y="477" width="18" height="5" rx="0" fill="#38bdf8" opacity="1"/><text x="313" y="486" font-size="18" fill="#38bdf8" text-anchor="start">Reversal</text><polyline points="80,348.57142857142856 234,348.57142857142856 388,348.57142857142856 542,420 696,312.8571428571429 850,205.71428571428572" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><rect x="500" y="477" width="18" height="5" rx="0" fill="#fbbf24" opacity="1"/><text x="528" y="486" font-size="18" fill="#fbbf24" text-anchor="start">Contrary first</text><polyline points="80,348.57142857142856 234,348.57142857142856 388,348.57142857142856 542,348.57142857142856 696,336.6666666666667 850,277.1428571428571" fill="none" stroke="#c4b5fd" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><rect x="715" y="477" width="18" height="5" rx="0" fill="#c4b5fd" opacity="1"/><text x="743" y="486" font-size="18" fill="#c4b5fd" text-anchor="start">Delayed</text><text x="80" y="451" font-size="20" fill="#a6b8cf" text-anchor="start">Before release</text><text x="850" y="451" font-size="20" fill="#a6b8cf" text-anchor="end">After release</text><text x="48" y="542" font-size="13" fill="#a6b8cf" text-anchor="start">SCHEMATIC • NOT MARKET DATA</text><text x="912" y="542" font-size="13" fill="#a6b8cf" text-anchor="end">STOCKPILOT / EDUCATION</text></g></svg>
