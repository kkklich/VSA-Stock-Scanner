<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Volume versus open interest</title><desc id="desc">Traded contracts during a period and contracts still open are different measurements. Shares, contracts and tick counts also use different units.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="960" height="560" rx="18" fill="#0b1425" opacity="1"/><text x="48" y="55" font-size="29" fill="#e7edf7" text-anchor="start">Volume versus open interest</text><line x1="48" y1="107" x2="912" y2="107" stroke="#24364f" stroke-width="2" /><rect x="64" y="181" width="404" height="210" rx="14" fill="#111e33" opacity="1"/><circle cx="91" cy="211" r="15" fill="#38bdf8"/><text x="91" y="217" font-size="17" fill="#0b1425" text-anchor="middle">1</text><text x="84" y="257" font-size="22" fill="#e7edf7" text-anchor="start">Volume: traded in interval</text><text x="480" y="293" font-size="30" fill="#fbbf24" text-anchor="middle">›</text><rect x="492" y="181" width="404" height="210" rx="14" fill="#111e33" opacity="1"/><circle cx="519" cy="211" r="15" fill="#38bdf8"/><text x="519" y="217" font-size="17" fill="#0b1425" text-anchor="middle">2</text><text x="512" y="257" font-size="22" fill="#e7edf7" text-anchor="start">Open interest: still open</text><text x="64" y="446" font-size="20" fill="#a6b8cf" text-anchor="start">Compare the same instrument, feed and interval</text><text x="48" y="542" font-size="13" fill="#a6b8cf" text-anchor="start">SCHEMATIC • NOT MARKET DATA</text><text x="912" y="542" font-size="13" fill="#a6b8cf" text-anchor="end">STOCKPILOT / EDUCATION</text></g></svg>
