<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Wolumen jest porównaniem względnym</title><desc id="desc">Ostatni wolumen jest niższy od każdej z dwóch poprzednich wartości. Różowy to jedynie konwencja prezentacji platformy.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="960" height="560" rx="18" fill="#0b1425" opacity="1"/><text x="48" y="55" font-size="29" fill="#e7edf7" text-anchor="start">Wolumen jest porównaniem względnym</text><line x1="48" y1="107" x2="912" y2="107" stroke="#24364f" stroke-width="2" /><line x1="65" y1="420" x2="880" y2="420" stroke="#24364f" stroke-width="2" /><text x="65" y="137" font-size="18" fill="#a6b8cf" text-anchor="start">WOLUMEN WZGLĘDNY</text><rect x="95" y="219.18032786885246" width="96" height="200.81967213114754" rx="4" fill="#38bdf8" opacity="1"/><text x="143" y="206.18032786885246" font-size="22" fill="#38bdf8" text-anchor="middle">120</text><text x="143" y="454" font-size="18" fill="#a6b8cf" text-anchor="middle">t − 2</text><rect x="345" y="269.38524590163934" width="96" height="150.61475409836066" rx="4" fill="#38bdf8" opacity="1"/><text x="393" y="256.38524590163934" font-size="22" fill="#38bdf8" text-anchor="middle">90</text><text x="393" y="454" font-size="18" fill="#a6b8cf" text-anchor="middle">t − 1</text><rect x="595" y="361.4275956284153" width="96" height="58.572404371584696" rx="4" fill="#c4b5fd" opacity="1"/><text x="643" y="348.4275956284153" font-size="22" fill="#c4b5fd" text-anchor="middle">35</text><text x="643" y="454" font-size="18" fill="#a6b8cf" text-anchor="middle">t</text><text x="64" y="506" font-size="20" fill="#a6b8cf" text-anchor="start">35 &lt; 90; 35 &lt; 120</text><text x="48" y="542" font-size="13" fill="#a6b8cf" text-anchor="start">SCHEMAT • NIE DANE RYNKOWE</text><text x="912" y="542" font-size="13" fill="#a6b8cf" text-anchor="end">STOCKPILOT / EDUCATION</text></g></svg>
