<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Pięć wolumenów dziennych tworzy sumę tygodnia</title><desc id="desc">W tym przykładzie wolumeny dzienne 20, 30, 25, 35 i 40 sumują się do 150. Niepełny tydzień pomija część tej aktywności.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="960" height="560" rx="18" fill="#0b1425" opacity="1"/><text x="48" y="55" font-size="29" fill="#e7edf7" text-anchor="start">Pięć wolumenów dziennych tworzy sumę tygodnia</text><line x1="48" y1="107" x2="912" y2="107" stroke="#24364f" stroke-width="2" /><line x1="65" y1="420" x2="880" y2="420" stroke="#24364f" stroke-width="2" /><text x="65" y="137" font-size="18" fill="#a6b8cf" text-anchor="start">WOLUMEN WZGLĘDNY</text><rect x="95" y="319.59016393442624" width="90" height="100.40983606557376" rx="4" fill="#38bdf8" opacity="1"/><text x="140" y="306.59016393442624" font-size="22" fill="#38bdf8" text-anchor="middle">20</text><text x="140" y="454" font-size="18" fill="#a6b8cf" text-anchor="middle">Pon</text><rect x="245" y="269.38524590163934" width="90" height="150.61475409836066" rx="4" fill="#38bdf8" opacity="1"/><text x="290" y="256.38524590163934" font-size="22" fill="#38bdf8" text-anchor="middle">30</text><text x="290" y="454" font-size="18" fill="#a6b8cf" text-anchor="middle">Wt</text><rect x="395" y="294.48770491803276" width="90" height="125.51229508196724" rx="4" fill="#38bdf8" opacity="1"/><text x="440" y="281.48770491803276" font-size="22" fill="#38bdf8" text-anchor="middle">25</text><text x="440" y="454" font-size="18" fill="#a6b8cf" text-anchor="middle">Śr</text><rect x="545" y="244.28278688524588" width="90" height="175.71721311475412" rx="4" fill="#38bdf8" opacity="1"/><text x="590" y="231.28278688524588" font-size="22" fill="#38bdf8" text-anchor="middle">35</text><text x="590" y="454" font-size="18" fill="#a6b8cf" text-anchor="middle">Czw</text><rect x="695" y="219.18032786885246" width="90" height="200.81967213114754" rx="4" fill="#fbbf24" opacity="1"/><text x="740" y="206.18032786885246" font-size="22" fill="#fbbf24" text-anchor="middle">40</text><text x="740" y="454" font-size="18" fill="#a6b8cf" text-anchor="middle">Pt</text><text x="64" y="506" font-size="20" fill="#a6b8cf" text-anchor="start">Wolumen zamkniętego tygodnia = 150</text><text x="48" y="542" font-size="13" fill="#a6b8cf" text-anchor="start">SCHEMAT • NIE DANE RYNKOWE</text><text x="912" y="542" font-size="13" fill="#a6b8cf" text-anchor="end">STOCKPILOT / EDUCATION</text></g></svg>
