<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">OHLCV and valid input data</title><desc id="desc">High and Low enclose Open and Close; volume is non-negative. Use ordered timestamps, one instrument and one interval, and exclude unfinished bars.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="960" height="560" rx="18" fill="#0b1425" opacity="1"/><text x="48" y="55" font-size="29" fill="#e7edf7" text-anchor="start">OHLCV and valid input data</text><line x1="48" y1="107" x2="912" y2="107" stroke="#24364f" stroke-width="2" /><line x1="480" y1="173" x2="480" y2="365" stroke="#34d399" stroke-width="2" /><rect x="442" y="221" width="76" height="96" rx="2" fill="#34d399" opacity="1"/><line x1="438" y1="317" x2="387" y2="317" stroke="#38bdf8" stroke-width="2" /><text x="375" y="324" font-size="22" fill="#38bdf8" text-anchor="end">O 100</text><line x1="522" y1="173" x2="573" y2="173" stroke="#a6b8cf" stroke-width="2" /><text x="585" y="180" font-size="22" fill="#a6b8cf" text-anchor="start">H 112</text><line x1="522" y1="365" x2="573" y2="365" stroke="#a6b8cf" stroke-width="2" /><text x="585" y="372" font-size="22" fill="#a6b8cf" text-anchor="start">L 96</text><line x1="522" y1="221" x2="573" y2="221" stroke="#fbbf24" stroke-width="2" /><text x="585" y="228" font-size="22" fill="#fbbf24" text-anchor="start">C 108</text><text x="480" y="466" font-size="20" fill="#a6b8cf" text-anchor="middle">O = 100, H = 112, L = 96, C = 108</text><text x="64" y="506" font-size="20" fill="#a6b8cf" text-anchor="start">Volume and timestamp accompany every bar</text><text x="48" y="542" font-size="13" fill="#a6b8cf" text-anchor="start">SCHEMATIC • NOT MARKET DATA</text><text x="912" y="542" font-size="13" fill="#a6b8cf" text-anchor="end">STOCKPILOT / EDUCATION</text></g></svg>
