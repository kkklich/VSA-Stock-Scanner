<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Minervini 7 — Cena jest blisko maksimum 52-tygodniowego</title><desc id="desc">nie więcej niż 25% poniżej najwyższego maksimum z 252 sesji</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="960" height="560" rx="18" fill="#0b1425" opacity="1"/><text x="48" y="55" font-size="29" fill="#e7edf7" text-anchor="start">Minervini 7 — Cena jest blisko maksimum 52-tygodniowego</text><line x1="48" y1="107" x2="912" y2="107" stroke="#24364f" stroke-width="2" /><line x1="610" y1="160" x2="610" y2="420" stroke="#a6b8cf" stroke-width="2" /><rect x="560" y="160" width="100" height="130" rx="8" fill="#34d399" opacity="0.15"/><line x1="545" y1="160" x2="670" y2="160" stroke="#a6b8cf" stroke-width="2" stroke-dasharray="6 6"/><text x="690" y="167" font-size="21" fill="#a6b8cf" text-anchor="start">Maksimum 52 tyg.</text><text x="690" y="195" font-size="21" fill="#a6b8cf" text-anchor="start">= 200</text><line x1="545" y1="290" x2="670" y2="290" stroke="#34d399" stroke-width="2" stroke-dasharray="6 6"/><text x="690" y="297" font-size="21" fill="#34d399" text-anchor="start">200 × 0.75 = 150</text><line x1="545" y1="212" x2="670" y2="212" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 6"/><text x="690" y="219" font-size="21" fill="#fbbf24" text-anchor="start">C = 180</text><circle cx="610" cy="212" r="9" fill="#fbbf24"/><text x="65" y="220" font-size="28" fill="#e7edf7" text-anchor="start">Najwyżej 25% poniżej maksimum</text><text x="48" y="542" font-size="13" fill="#a6b8cf" text-anchor="start">SCHEMAT • NIE DANE RYNKOWE</text><text x="912" y="542" font-size="13" fill="#a6b8cf" text-anchor="end">STOCKPILOT / EDUCATION</text></g></svg>
