<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">52-week high and low</title><desc id="desc">The reference extrema come from 252 sessions, not just the visible short-term swing.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="960" height="560" rx="18" fill="#0b1425" opacity="1"/><text x="48" y="55" font-size="29" fill="#e7edf7" text-anchor="start">52-week high and low</text><line x1="48" y1="107" x2="912" y2="107" stroke="#24364f" stroke-width="2" /><line x1="70" y1="170" x2="870" y2="170" stroke="#24364f" stroke-width="2" /><line x1="70" y1="232" x2="870" y2="232" stroke="#24364f" stroke-width="2" /><line x1="70" y1="295" x2="870" y2="295" stroke="#24364f" stroke-width="2" /><line x1="70" y1="357" x2="870" y2="357" stroke="#24364f" stroke-width="2" /><line x1="70" y1="420" x2="870" y2="420" stroke="#24364f" stroke-width="2" /><line x1="70" y1="420" x2="870" y2="420" stroke="#a6b8cf" stroke-width="2" stroke-dasharray="6 6"/><text x="870" y="411" font-size="19" fill="#a6b8cf" text-anchor="end">52-week low</text><line x1="70" y1="170" x2="870" y2="170" stroke="#a6b8cf" stroke-width="2" stroke-dasharray="6 6"/><text x="870" y="161" font-size="19" fill="#a6b8cf" text-anchor="end">52-week high</text><polyline points="80,420 150,353.3333333333333 220,375.55555555555554 290,281.1111111111111 360,325.55555555555554 430,242.22222222222223 500,308.8888888888889 570,197.7777777777778 640,214.44444444444446 710,231.11111111111111 780,170 850,208.88888888888889" fill="none" stroke="#34d399" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><rect x="70" y="477" width="18" height="5" rx="0" fill="#34d399" opacity="1"/><text x="98" y="486" font-size="18" fill="#34d399" text-anchor="start">Price</text><text x="80" y="451" font-size="20" fill="#a6b8cf" text-anchor="start">252-session window</text><text x="850" y="451" font-size="20" fill="#a6b8cf" text-anchor="end">Last close</text><text x="48" y="542" font-size="13" fill="#a6b8cf" text-anchor="start">SCHEMATIC • NOT MARKET DATA</text><text x="912" y="542" font-size="13" fill="#a6b8cf" text-anchor="end">STOCKPILOT / EDUCATION</text></g></svg>
