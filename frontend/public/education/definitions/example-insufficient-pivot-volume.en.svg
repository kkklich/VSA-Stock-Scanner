<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">A rising close with insufficient volume</title><desc id="desc">A signal-day volume of 90 is below the largest down-day volume of 100. A rising close cannot compensate for this failed volume check.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="960" height="560" rx="18" fill="#0b1425" opacity="1"/><text x="48" y="55" font-size="29" fill="#e7edf7" text-anchor="start">A rising close with insufficient volume</text><line x1="48" y1="107" x2="912" y2="107" stroke="#24364f" stroke-width="2" /><line x1="65" y1="420" x2="880" y2="420" stroke="#24364f" stroke-width="2" /><text x="65" y="137" font-size="18" fill="#a6b8cf" text-anchor="start">RELATIVE VOLUME</text><rect x="95" y="219.18032786885246" width="96" height="200.81967213114754" rx="4" fill="#38bdf8" opacity="1"/><text x="143" y="206.18032786885246" font-size="22" fill="#38bdf8" text-anchor="middle">100</text><text x="143" y="454" font-size="18" fill="#a6b8cf" text-anchor="middle">Down-day max</text><rect x="470" y="239.2622950819672" width="96" height="180.7377049180328" rx="4" fill="#fb7185" opacity="1"/><text x="518" y="226.2622950819672" font-size="22" fill="#fb7185" text-anchor="middle">90</text><text x="518" y="454" font-size="18" fill="#a6b8cf" text-anchor="middle">Candidate day</text><line x1="64" y1="219.18032786885246" x2="880" y2="219.18032786885246" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="7 7"/><text x="880" y="207.18032786885246" font-size="19" fill="#c4b5fd" text-anchor="end">Required minimum = 100</text><text x="48" y="542" font-size="13" fill="#a6b8cf" text-anchor="start">SCHEMATIC • NOT MARKET DATA</text><text x="912" y="542" font-size="13" fill="#a6b8cf" text-anchor="end">STOCKPILOT / EDUCATION</text></g></svg>
