<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Duży dzień wzrostowy nie jest odniesieniem</title><desc id="desc">Wśród tych przykładowych dni odniesienia największy wolumen dnia spadkowego wynosi 100. Wzrostowy dzień z wolumenem 180 nie należy do tego maksimum; wolumen sygnału 120 spełnia to jedno porównanie.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="960" height="560" rx="18" fill="#0b1425" opacity="1"/><text x="48" y="55" font-size="29" fill="#e7edf7" text-anchor="start">Duży dzień wzrostowy nie jest odniesieniem</text><line x1="48" y1="107" x2="912" y2="107" stroke="#24364f" stroke-width="2" /><line x1="65" y1="420" x2="880" y2="420" stroke="#24364f" stroke-width="2" /><text x="65" y="137" font-size="18" fill="#a6b8cf" text-anchor="start">WOLUMEN WZGLĘDNY</text><rect x="95" y="330.74681238615665" width="96" height="89.25318761384335" rx="4" fill="#fb7185" opacity="1"/><text x="143" y="317.74681238615665" font-size="22" fill="#fb7185" text-anchor="middle">80</text><text x="143" y="454" font-size="18" fill="#a6b8cf" text-anchor="middle">Dzień</text><text x="143" y="479" font-size="18" fill="#a6b8cf" text-anchor="middle">spadkowy</text><rect x="282.5" y="219.18032786885246" width="96" height="200.81967213114754" rx="4" fill="#34d399" opacity="1"/><text x="330.5" y="206.18032786885246" font-size="22" fill="#34d399" text-anchor="middle">180</text><text x="330.5" y="454" font-size="18" fill="#a6b8cf" text-anchor="middle">Dzień</text><text x="330.5" y="479" font-size="18" fill="#a6b8cf" text-anchor="middle">wzrostowy</text><rect x="470" y="308.43351548269584" width="96" height="111.56648451730416" rx="4" fill="#fb7185" opacity="1"/><text x="518" y="295.43351548269584" font-size="22" fill="#fb7185" text-anchor="middle">100</text><text x="518" y="454" font-size="18" fill="#a6b8cf" text-anchor="middle">Dzień</text><text x="518" y="479" font-size="18" fill="#a6b8cf" text-anchor="middle">spadkowy</text><rect x="657.5" y="286.120218579235" width="96" height="133.87978142076503" rx="4" fill="#fbbf24" opacity="1"/><text x="705.5" y="273.120218579235" font-size="22" fill="#fbbf24" text-anchor="middle">120</text><text x="705.5" y="454" font-size="18" fill="#a6b8cf" text-anchor="middle">Dzień sygnału</text><line x1="64" y1="308.43351548269584" x2="880" y2="308.43351548269584" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="7 7"/><text x="880" y="296.43351548269584" font-size="19" fill="#c4b5fd" text-anchor="end">V = 100</text><text x="64" y="506" font-size="20" fill="#a6b8cf" text-anchor="start">Wybrane dni z okna odniesienia 10 sesji</text><text x="48" y="542" font-size="13" fill="#a6b8cf" text-anchor="start">SCHEMAT • NIE DANE RYNKOWE</text><text x="912" y="542" font-size="13" fill="#a6b8cf" text-anchor="end">STOCKPILOT / EDUCATION</text></g></svg>
