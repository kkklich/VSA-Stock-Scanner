name: Deploy to VPS

on:
  push:
    branches:
      - main # change to your default branch if it's 'master'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            # 1. Navigate to your app directory
            cd /var/www/stocksignal # UPDATE THIS to your actual project path

            # 2. Pull the latest commits
            git pull origin main

            # 3. Rebuild / restart steps (adjust based on your stack):
            # For a static/frontend build:
            # npm ci
            # npm run build

            # For backend/services (if applicable):
            # pm2 restart stocksignal
            # or: sudo systemctl restart your-service
            # or: docker compose up -d --build