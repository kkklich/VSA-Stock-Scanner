# StockPilot — deploy to the Oracle VPS, including archive-based installations.
#
# Triggered by the CI workflow finishing SUCCESSFULLY on main/master (or
# manually from the Actions tab). Upload the checked commit, rebuild the
# containers over SSH, restart, then check health. No server Git checkout or
# server-side GitHub credentials are needed. Keep .env.prod and data on the VPS.
#
# Why not "on: push"? Because then the VPS rebuild raced the tests: both
# workflows started at the same moment, so the server could be rebuilding a
# commit that CI was in the middle of failing. Waiting for the CI run means a
# red build never reaches the server.
#
# Note: GitHub only honours a workflow_run trigger from the copy of this file on
# the DEFAULT branch, so edits to the trigger take effect once they are on main.
#
# ── Required GitHub repository secrets ────────────────────────────────────────
# Settings → Secrets and variables → Actions → "New repository secret":
#
#   VPS_HOST        the server's IP address or hostname, e.g. 203.0.113.10
#   VPS_USER        the SSH user that owns the checkout, e.g. stockpilot
#   VPS_SSH_KEY     the PRIVATE half of a deploy key (whole file, including the
#                   "-----BEGIN OPENSSH PRIVATE KEY-----" line). Generate on the
#                   VPS with:  ssh-keygen -t ed25519 -C "github-deploy" -f ~/.ssh/github_deploy
#                   then:      cat ~/.ssh/github_deploy.pub >> ~/.ssh/authorized_keys
#                   and paste the contents of ~/.ssh/github_deploy as the secret.
#   VPS_PORT        (optional) SSH port if it isn't 22
#   VPS_PATH        (optional) app path, e.g. /home/opc/stockpilot; defaults to
#                   the SSH user's home directory followed by /stockpilot
#   VPS_FINGERPRINT (optional) SSH host fingerprint, shared by upload and deploy
#
# The SSH user needs passwordless sudo for the Docker deployment (as opc has
# on the Oracle image). The existing VPS folder must contain .env.prod.
#
# Until these secrets exist the job fails fast with a clear message — deploying
# by hand (ssh in, `bash deploy/deploy.sh`) stays perfectly valid.

name: Deploy

permissions:
  contents: read

on:
  workflow_run:
    # The name: field of ci.yml.
    workflows: [CI]
    types: [completed]
    # The branch the CI run was for — not the branch this workflow reads from.
    branches: [main, master]
  workflow_dispatch:

concurrency:
  # Never let two deploys touch the server at the same time.
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Rebuild and restart on the VPS
    runs-on: ubuntu-latest
    environment: production
    # workflow_run fires whether CI passed or failed, so the gate lives here:
    # deploy when a push-triggered CI run went green, or when a human clicks
    # "Run workflow" in the Actions tab (the manual escape hatch).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')

    steps:
      - name: Say what is being deployed and why
        # Everything is passed as an env var rather than substituted into the
        # script text, for the same shell-injection reason as REF_NAME below.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          ACTOR: ${{ github.actor }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual deploy of $BRANCH, started by $ACTOR."
          else
            echo "CI run $CI_RUN_ID went green for commit $CI_SHA on $BRANCH."
            echo "Deploying the exact commit checked by CI."
          fi

      - name: Check that the deploy secrets are configured
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          missing=""
          [ -z "$VPS_HOST" ]    && missing="$missing VPS_HOST"
          [ -z "$VPS_USER" ]    && missing="$missing VPS_USER"
          [ -z "$VPS_SSH_KEY" ] && missing="$missing VPS_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — see the comments at the top of .github/workflows/deploy.yml"
            exit 1
          fi

      - name: Check out the selected commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Package application source
        run: |
          git archive --format=tar.gz --output=stockpilot-release.tar.gz HEAD \
            backend-python frontend deploy docker-compose.prod.yml env.prod.example

      - name: Upload source to the VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          source: stockpilot-release.tar.gz
          target: /tmp/stockpilot-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.VPS_PATH }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          DEPLOY_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          # Building the images can take a few minutes on a small VPS.
          command_timeout: 30m
          envs: DEPLOY_PATH,DEPLOY_SHA,DEPLOY_RUN
          script: |
            set -euo pipefail
            app_path="${DEPLOY_PATH:-$HOME/stockpilot}"
            case "$app_path" in
              '~/'*) app_path="$HOME/${app_path:2}" ;;
            esac
            cd "$app_path"
            test -f .env.prod || { echo 'Missing server configuration: .env.prod'; exit 1; }
            sudo -n docker compose version
            archive="/tmp/stockpilot-$DEPLOY_RUN/stockpilot-release.tar.gz"
            tar -xzf "$archive" --no-same-owner
            sudo -n bash deploy/deploy.sh --skip-pull
            printf '%s\n' "$DEPLOY_SHA" > .deployed-sha
            rm -f -- "$archive"
            rmdir -- "/tmp/stockpilot-$DEPLOY_RUN"
