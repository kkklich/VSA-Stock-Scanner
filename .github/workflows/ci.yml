# StockPilot — continuous integration.
#
# Runs on every push and pull request, in this order: lint + test the Python
# backend and lint + type-check + build the React frontend (in parallel), and
# only if BOTH are green, test-build the two Docker images. Nothing is deployed
# here — that is deploy.yml, which is triggered by this workflow finishing
# successfully, so nothing reaches the server until these checks pass.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend — Ruff + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-python

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend-python/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt ruff

      - name: Lint (Ruff)
        # Blocking. The backlog this step used to tolerate (over-long lines in
        # the tests, unsorted imports in the alembic revisions, UP042 on the VSA
        # enums, B904 on the health probe) was cleared in 2026-09-06, so a new
        # finding now means a new finding — and letting those pile up silently in
        # a green log is how the backlog happened in the first place.
        run: ruff check .

      - name: Tests (pytest)
        # The suite runs without a database — the app degrades gracefully when
        # STOCKPILOT_DATABASE_URL is unset, and the tests rely on that.
        run: pytest -q

  frontend:
    name: Frontend — TypeScript build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Build (tsc + vite)
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    # Last, not in parallel: there is no point spending minutes building images
    # out of code that failed its tests or its type check. If either job above
    # is red this one is skipped, and the whole workflow is red either way.
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5

      # Catches a broken Dockerfile before it reaches the VPS. Build only —
      # nothing is pushed to a registry; the server builds its own images.
      - name: Build API image
        run: docker build -t stockpilot-api:ci ./backend-python

      - name: Build web image
        run: docker build -t stockpilot-web:ci ./frontend
